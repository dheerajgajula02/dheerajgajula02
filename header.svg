<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Box -->
  <rect width="900" height="220" rx="16" fill="url(#bgGradient)" />
  <rect width="900" height="220" rx="16" fill="url(#grid)" />
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Network Topology Abstract Nodes (Right Side) -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1.2">
    <!-- Links -->
    <line x1="680" y1="50" x2="770" y2="90" stroke-dasharray="3,3" />
    <line x1="770" y1="90" x2="840" y2="60" />
    <line x1="770" y1="90" x2="740" y2="160" />
    <line x1="740" y1="160" x2="830" y2="170" />
    <line x1="840" y1="60" x2="830" y2="170" />
    <line x1="630" y1="130" x2="680" y2="50" />
    <line x1="630" y1="130" x2="740" y2="160" />
  </g>
  <g fill="#38bdf8">
    <circle cx="680" cy="50" r="4" filter="url(#glow)" fill="#38bdf8" />
    <circle cx="770" cy="90" r="6" filter="url(#glow)" fill="#818cf8" />
    <circle cx="840" cy="60" r="4.5" filter="url(#glow)" fill="#c084fc" />
    <circle cx="740" cy="160" r="5" filter="url(#glow)" fill="#38bdf8" />
    <circle cx="830" cy="170" r="4" filter="url(#glow)" fill="#818cf8" />
    <circle cx="630" cy="130" r="3.5" filter="url(#glow)" fill="#c084fc" />
  </g>

  <!-- Terminal Dot Header Indicator -->
  <g transform="translate(40, 32)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="16" cy="0" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="32" cy="0" r="5" fill="#10b981" opacity="0.8" />
    <text x="50" y="4" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#64748b" letter-spacing="1">DHEERAJ_GAJULA // NET_SYS_ENG</text>
  </g>

  <!-- Main Name Title -->
  <text x="40" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#titleGradient)" letter-spacing="0.5">
    Dheeraj Gajula
  </text>

  <!-- Tagline / Focus -->
  <text x="40" y="132" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" font-size="15" fill="#94a3b8" font-weight="500">
    Network &amp; Systems Engineer <tspan fill="#38bdf8">•</tspan> Distributed Systems <tspan fill="#38bdf8">•</tspan> Homelab Architect
  </text>

  <!-- Pills / Badges in Header -->
  <g transform="translate(40, 160)">
    <!-- Pill 1: CU Boulder -->
    <rect x="0" y="0" width="175" height="26" rx="6" fill="#1e293b" stroke="#cfb87c" stroke-width="1" />
    <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfb87c" font-weight="600">🦬 CU BOULDER CS+NET</text>

    <!-- Pill 2: Fedora -->
    <rect x="185" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#51a2da" stroke-width="1" />
    <text x="195" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#51a2da" font-weight="600">🐧 FEDORA LINUX</text>

    <!-- Pill 3: SDN & Intent -->
    <rect x="325" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="335" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#818cf8" font-weight="600">⚡ SDN &amp; MCP AGENTS</text>

    <!-- Pill 4: Golang / Python -->
    <rect x="480" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="490" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="600">🛠️ GO &amp; PYTHON</text>
  </g>
</svg>
